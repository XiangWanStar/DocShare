# Nginx 反向代理示例：把 80 端口请求转发到 FastAPI，
# 并把 /onlyoffice/ 路径转发到 OnlyOffice Document Server。
# 生产环境建议配置 HTTPS（certbot 自动签发）。

server {
    listen 80;
    server_name your-domain.com;   # 改成你的域名或 IP

    client_max_body_size 60m;

    # 后端 API + 前端静态页面
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OnlyOffice Document Server
    location /onlyoffice/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    # OnlyOffice WebSocket（协同编辑）
    location /onlyoffice/websocket/ {
        proxy_pass http://127.0.0.1:8080/websocket/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }
}
